[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamatrix-print-service"
version = "0.1.0"
description = "DataMatrix print service for Savema TTO printers"
requires-python = ">=3.11"
dependencies = ["flask>=3.0"]

[tool.setuptools]
py-modules = ["savema_printer", "csv_processor", "config", "main", "web_ui"]
