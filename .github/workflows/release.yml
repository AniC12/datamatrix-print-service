name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, no runtime needed on target)
        shell: pwsh
        run: >
          dotnet publish
          application/src/Hosts/CodePrintManager.Desktop/CodePrintManager.Desktop.csproj
          -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Package & upload with Velopack
        shell: pwsh
        env:
          RELEASES_REPO: https://github.com/AniC12/codeprintmanager-releases
        run: |
          dotnet tool install -g vpk --version 1.2.0
          vpk download github --repoUrl $env:RELEASES_REPO --token ${{ secrets.RELEASES_TOKEN }}
          # Installer only: --noPortable keeps the portable bundle out of the release so
          # there is exactly one way to install. -e must match <AssemblyName> in
          # CodePrintManager.Desktop.csproj, and equals -u so that the execution stub and
          # the binary inside current\ are both named CodePrintManager.exe.
          vpk pack -u CodePrintManager -v ${{ steps.version.outputs.version }} -p publish -e CodePrintManager.exe --noPortable

          # GitHub's release asset API is unreliable for the ~80 MB assets this app
          # produces, and has failed mid-upload on most releases so far. vpk retries
          # internally and then gives up, leaving a draft release; on a fresh attempt it
          # uploads only the assets that are still missing, so retrying is safe and
          # resumes rather than restarting. Without this, a flaky upload means the
          # release has to be re-run by hand.
          $PSNativeCommandUseErrorActionPreference = $false
          $attempts = 4
          for ($i = 1; $i -le $attempts; $i++) {
            vpk upload github --repoUrl $env:RELEASES_REPO --token ${{ secrets.RELEASES_TOKEN }} --publish --releaseName "Code Print Manager v${{ steps.version.outputs.version }}" --tag v${{ steps.version.outputs.version }}
            if ($LASTEXITCODE -eq 0) {
              Write-Host "::notice::vpk upload succeeded on attempt $i of $attempts"
              break
            }
            if ($i -eq $attempts) {
              throw "vpk upload failed after $attempts attempts (last exit code $LASTEXITCODE)"
            }
            $wait = 30 * $i
            Write-Host "::warning::vpk upload attempt $i failed (exit $LASTEXITCODE); retrying in $wait s"
            Start-Sleep -Seconds $wait
          }

      - name: Update releases repo README
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $date = Get-Date -Format "yyyy-MM-dd"
          $readme = @"
          # Code Print Manager

          **Latest version: v${version}** (${date})

          ## Download

          **[Download Code Print Manager v${version}](https://github.com/AniC12/codeprintmanager-releases/releases/latest/download/CodePrintManager-win-Setup.exe)**

          Run the installer and launch **Code Print Manager** from the Start Menu. No administrator
          rights are required, and the application updates itself from then on.

          The program is always called ``CodePrintManager.exe``. Your database, backups and logs are
          kept separately in ``%LocalAppData%\CodePrintManagerData``, so updates never touch them.

          ## All releases

          See [all releases](https://github.com/AniC12/codeprintmanager-releases/releases) for previous versions.
          "@
          $readme = $readme -replace '(?m)^          ', ''
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($readme)
          $base64 = [Convert]::ToBase64String($bytes)

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github.v3+json" }
          try {
            $current = Invoke-RestMethod -Uri "https://api.github.com/repos/AniC12/codeprintmanager-releases/contents/README.md" -Headers $headers
            $sha = $current.sha
          } catch {
            $sha = $null
          }

          $body = @{ message = "Update README for v${version}"; content = $base64 }
          if ($sha) { $body.sha = $sha }
          $json = $body | ConvertTo-Json

          Invoke-RestMethod -Method Put -Uri "https://api.github.com/repos/AniC12/codeprintmanager-releases/contents/README.md" -Headers $headers -Body $json -ContentType "application/json"
