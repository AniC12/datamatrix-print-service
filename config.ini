[printer]
host = 127.0.0.1
port = 9100
timeout = 5.0
retries = 3
retry_delay = 1.0

[savema]
# Template file name on the printer (.rox format)
template_name = gs1label_32.rox
# Name of the 2D barcode object in the template (Source must be External)
datamatrix_field = gs1_code

[csv]
column =
delimiter = ,
has_header = true

[mode]
dry_run = false
log_level = INFO
